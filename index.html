<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Marketplace Mini App</title>
    
    <!-- Подключаем Telegram Web App JS API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Подключаем TonConnect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        /* === СТИЛИ ДЛЯ АВТОРИЗАЦИИ И БЛОКИРОВКИ === */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f11;
            color: #ffffff;
        }

        /* Фиксированный фон на весь экран */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            pointer-events: auto;
        }

        /* Карточка авторизации */
        .auth-card {
            background: #1c1c1e;
            color: #ffffff;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .auth-card h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .auth-card p {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Блокировка скролла при открытом окне */
        body.auth-locked {
            overflow: hidden !important;
            touch-action: none;
        }

        /* Основной контент приложения */
        .app-container {
            padding: 16px;
        }
    </style>
</head>
<body>

    <!-- Оверлей авторизации (блокирует интерфейс, пока кошелек не подключен) -->
    <div id="auth-modal" class="auth-overlay">
        <div class="auth-card">
            <h2>Добро пожаловать</h2>
            <p>Для доступа к приложению необходимо подключить ваш TON кошелек.</p>
            <!-- Контейнер для кнопки TonConnect -->
            <div id="ton-connect-button"></div>
        </div>
    </div>

    <!-- Основной контент вашего Mini App -->
    <div class="app-container">
        <h1>NFT Marketplace</h1>
        <p>Здесь находится защищенный контент приложения, доступный только после авторизации.</p>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Инициализация TonConnect UI с вашим реальным доменом
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://mrktmarket.github.io/mrkt/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        const authModal = document.getElementById('auth-modal');

        // Функция блокировки/разблокировки интерфейса
        function setAuthLock(isLocked) {
            if (isLocked) {
                authModal.style.display = 'flex';
                document.body.classList.add('auth-locked');
                if (tg.BackButton) tg.BackButton.hide();
            } else {
                authModal.style.display = 'none';
                document.body.classList.remove('auth-locked');
                if (tg.BackButton) tg.BackButton.show();
            }
        }

        // Проверка состояния кошелька при загрузке и изменении статуса
        tonConnectUI.onStatusChange((wallet) => {
            if (wallet) {
                // Кошелек подключен — скрываем оверлей и открываем доступ
                setAuthLock(false);
                console.log('Пользователь авторизован:', wallet.account.address);
            } else {
                // Кошелек не подключен — блокируем доступ
                setAuthLock(true);
            }
        });

        // Защита от закрытия по клику
        authModal.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
