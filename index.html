<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRKT — Digital Assets Marketplace</title>
    <!-- Подключаем TonConnect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 75px;
        }
        /* Верхняя плашка с кнопкой Connect */
        .connect-header-wrap {
            display: flex;
            justify-content: flex-end;
            padding: 10px 14px 4px 14px;
            background: #181818;
        }
        .connect-top-btn {
            background: #ffd300;
            color: #000;
            border: none;
            padding: 7px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        /* Верхние категории-вкладки */
        .top-categories {
            display: flex;
            gap: 6px;
            padding: 8px 12px 12px 12px;
            background: #181818;
            overflow-x: auto;
            align-items: center;
        }
        .cat-btn {
            background: #232323;
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn.active {
            background: #2b2b2b;
            border: 1px solid #444;
        }
        .cat-icon-only {
            background: #232323;
            border: none;
            color: #bbb;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }
        /* Поиск и Feed */
        .search-row {
            display: flex;
            gap: 8px;
            padding: 0 12px 12px 12px;
            background: #181818;
            align-items: center;
        }
        .search-box {
            flex: 1;
            background: #242424;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #777;
            font-size: 13px;
        }
        .feed-btn {
            background: #242424;
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        /* Фильтры */
        .filters {
            display: flex;
            gap: 6px;
            padding: 0 12px 12px 12px;
            overflow-x: auto;
            background: #181818;
            border-bottom: 1px solid #202020;
        }
        .filter-pill {
            background: #202020;
            border: 1px solid #2c2c2c;
            color: #bbb;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
        }
        /* Сетка товаров */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }
        .item-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #262626;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
        }
        .item-img-container {
            height: 155px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .item-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Плашки свойств на картинке */
        .card-badges {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .badge-mini {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 11px;
        }
        .item-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: #181818;
        }
        .item-name {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
        }
        .item-hash {
            font-size: 11px;
            color: #777;
            margin-bottom: 4px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222222;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }
        .price-val {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .cart-icon {
            color: #888;
            font-size: 14px;
        }
        /* Кнопка купить оптом */
        .bulk-buy-container {
            padding: 0 12px 10px 12px;
        }
        .bulk-btn {
            width: 100%;
            background: #252525;
            border: 1px solid #333;
            color: #fff;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
        /* Нижняя навигация */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }
        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #777;
            font-size: 10px;
            gap: 3px;
            text-decoration: none;
        }
        .nav-link.active {
            color: #ffa500;
        }
        .nav-link span:first-child {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Верхняя кнопка подключения -->
    <div class="connect-header-wrap">
        <button id="connect-wallet-btn" class="connect-top-btn">Connect</button>
    </div>

    <!-- Верхние категории -->
    <div class="top-categories">
        <button class="cat-btn active">🎁 Подарки</button>
        <button class="cat-btn">🪖</button>
        <button class="cat-btn">⭐</button>
        <button class="cat-btn">🛡️</button>
        <button class="cat-btn">💬</button>
        <button class="cat-icon-only">🛒</button>
    </div>

    <!-- Поиск и Feed -->
    <div class="search-row">
        <div class="search-box">
            <span>🔍</span> Поиск по названию NFT
        </div>
        <button class="feed-btn">📋 Feed</button>
    </div>

    <!-- Фильтры -->
    <div class="filters">
        <div class="filter-pill">⚡ NFT ▾</div>
        <div class="filter-pill">🎨 Модель ▾</div>
        <div class="filter-pill">🌌 Фон ▾</div>
        <div class="filter-pill">💎 Свойства ▾</div>
    </div>

    <!-- Сетка товаров -->
    <div class="grid">
        <!-- Карточка 1 -->
        <div class="item-card buy-btn">
            <div class="item-img-container" style="background: #364860;">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60" alt="Pool Float">
            </div>
            <div class="item-details">
                <div class="item-name">Pool Float</div>
                <div class="item-hash">#162015</div>
                <div class="price-row">
                    <div class="price-val">💎 4.19</div>
                    <div class="cart-icon">🛒</div>
                </div>
            </div>
        </div>

        <!-- Карточка 2 -->
        <div class="item-card buy-btn">
            <div class="item-img-container" style="background: #603d36;">
                <img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=300&auto=format&fit=crop&q=60" alt="Pool Float">
            </div>
            <div class="item-details">
                <div class="item-name">Pool Float</div>
                <div class="item-hash">#224944</div>
                <div class="price-row">
                    <div class="price-val">💎 3.94</div>
                    <div class="cart-icon">🛒</div>
                </div>
            </div>
        </div>

        <!-- Карточка 3 -->
        <div class="item-card buy-btn">
            <div class="item-img-container" style="background: #39294a;">
                <div class="card-badges">
                    <div class="badge-mini">🍀</div>
                    <div class="badge-mini">🔟</div>
                </div>
                <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=300&auto=format&fit=crop&q=60" alt="Happy Brownie">
            </div>
            <div class="item-details">
                <div class="item-name">Happy Brownie</div>
                <div class="item-hash">#105302</div>
                <div class="price-row">
                    <div class="price-val">💎 12.5</div>
                    <div class="cart-icon">🛒</div>
                </div>
            </div>
        </div>

        <!-- Карточка 4 -->
        <div class="item-card buy-btn">
            <div class="item-img-container" style="background: #523444;">
                <div class="card-badges">
                    <div class="badge-mini">🍀</div>
                </div>
                <img src="https://images.unsplash.com/photo-1618172193763-c511deb635ca?w=300&auto=format&fit=crop&q=60" alt="Cupid Charm">
            </div>
            <div class="item-details">
                <div class="item-name">Cupid Charm</div>
                <div class="item-hash">#3179</div>
                <div class="price-row">
                    <div class="price-val">💎 24.11</div>
                    <div class="cart-icon">🛒</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка купить оптом -->
    <div class="bulk-buy-container">
        <button class="bulk-btn">🛒 Купить оптом</button>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <a class="nav-link active">
            <span>🎛️</span>
            Маркет
        </a>
        <a class="nav-link">
            <span>📄</span>
            Ордеры
        </a>
        <a class="nav-link">
            <span>🎮</span>
            Игровой хаб
        </a>
        <a class="nav-link" style="color: #ff9900;">
            <span>🎃</span>
            Halloween
        </a>
        <a class="nav-link">
            <span>📦</span>
            Хранилище
        </a>
    </div>

    <!-- Подключаем логику -->
    <script src="app.js"></script>
</body>
</html>
