<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Marketplace</title>
    <!-- Подключаем Tailwind CSS для быстрого и красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tgBg: '#181818',
                        tgCard: '#212121',
                        tgButton: '#2ea6ff',
                        tgText: '#ffffff',
                        tgHint: '#aaaaaa'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tgBg text-tgText font-sans select-none pb-20">

    <!-- Верхняя панель (Шапка) -->
    <header class="flex justify-between items-center p-4 border-b border-zinc-800 sticky top-0 bg-tgBg/90 backdrop-blur z-10">
        <div class="flex items-center space-x-2">
            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-1 rounded-full font-medium">ЕП</span>
            <div class="flex items-center space-x-1 text-sm font-semibold">
                <span>💎</span>
                <span id="user-balance">0.00</span>
            </div>
        </div>
        <!-- Кнопка подключения кошелька -->
        <button id="connect-wallet-btn" class="bg-tgButton hover:bg-sky-500 text-white text-sm font-medium px-4 py-1.5 rounded-xl transition">
            Connect Wallet
        </button>
    </header>

    <!-- Основной контент (Маркет) -->
    <main class="p-4">
        <!-- Баннер -->
        <div class="bg-gradient-to-r from-blue-600/30 to-purple-600/30 border border-blue-500/30 rounded-2xl p-4 mb-4">
            <h2 class="font-bold text-base mb-1">Myth mask улучшена</h2>
            <p class="text-xs text-tgHint mb-3">Торги запущены. Успей забрать редкие активы.</p>
            <button class="bg-white text-black text-xs font-bold px-3 py-1.5 rounded-lg">Вперед!</button>
        </div>

        <!-- Поиск -->
        <div class="mb-4">
            <input type="text" placeholder="Поиск по названию NFT / нс" class="w-full bg-tgCard text-sm text-white px-4 py-2.5 rounded-xl outline-none border border-zinc-800 focus:border-tgButton transition">
        </div>

        <!-- Сетка товаров (Карточки NFT) -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Товар 1 -->
            <div class="bg-tgCard border border-zinc-800 rounded-2xl p-3 flex flex-col justify-between item-card" data-item="Myth Mask #150403">
                <div>
                    <div class="bg-zinc-800/50 rounded-xl h-36 flex items-center justify-center mb-3 text-3xl">
                        🦋
                    </div>
                    <h3 class="font-semibold text-sm truncate">Myth Mask</h3>
                    <p class="text-xs text-tgHint">#150403</p>
                </div>
                <div class="flex items-center justify-between mt-3 pt-2 border-t border-zinc-800/60">
                    <span class="text-xs font-bold">💎 11.22</span>
                    <button class="buy-btn bg-zinc-800 hover:bg-tgButton hover:text-white p-2 rounded-xl transition">
                        🛒
                    </button>
                </div>
            </div>

            <!-- Товар 2 -->
            <div class="bg-tgCard border border-zinc-800 rounded-2xl p-3 flex flex-col justify-between item-card" data-item="Swag Bag #210929">
                <div>
                    <div class="bg-zinc-800/50 rounded-xl h-36 flex items-center justify-center mb-3 text-3xl">
                        💰
                    </div>
                    <h3 class="font-semibold text-sm truncate">Swag Bag</h3>
                    <p class="text-xs text-tgHint">#210929</p>
                </div>
                <div class="flex items-center justify-between mt-3 pt-2 border-t border-zinc-800/60">
                    <span class="text-xs font-bold">💎 6.53</span>
                    <button class="buy-btn bg-zinc-800 hover:bg-tgButton hover:text-white p-2 rounded-xl transition">
                        🛒
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Нижняя навигация (Меню) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-tgCard/95 backdrop-blur border-t border-zinc-800 flex justify-around py-3 text-xs text-tgHint z-10">
        <button class="flex flex-col items-center text-tgButton">
            <span class="text-lg">🛍️</span>
            <span>Маркет</span>
        </button>
        <button class="flex flex-col items-center hover:text-white transition">
            <span class="text-lg">📑</span>
            <span>Ордеры</span>
        </button>
        <button class="flex flex-col items-center hover:text-white transition">
            <span class="text-lg">🎮</span>
            <span>Игровой хаб</span>
        </button>
        <button class="flex flex-col items-center hover:text-white transition">
            <span class="text-lg">🎃</span>
            <span>Halloween</span>
        </button>
        <button class="flex flex-col items-center hover:text-white transition">
            <span class="text-lg">📦</span>
            <span>Хранилище</span>
        </button>
    </nav>

    <!-- Подключаем скрипт TonConnect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
